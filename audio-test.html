<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZDC Audio Engine Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b0812;
      color: #f5f0ff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 26px;
      background: #171020;
      border: 1px solid #59377c;
      border-radius: 18px;
    }

    h1 {
      margin-top: 0;
      color: #c9a0ff;
    }

    p {
      color: #c5bacf;
      line-height: 1.6;
    }

    input,
    button,
    a {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
    }

    input {
      border: 1px solid #59446d;
      color: white;
      background: #100b18;
    }

    button {
      border: 0;
      background: #8b45d6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    a {
      display: none;
      background: #292039;
      color: #e0c7ff;
      text-align: center;
      text-decoration: none;
    }

    #status {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .warning {
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>ZDC Audio Engine</h1>

    <p>
      Tes mesin konversi audio ZDC sebelum dipasang
      ke dashboard utama.
    </p>

    <p>
      Volume: -8 dB<br>
      Kecepatan: 2,3×<br>
      Format hasil: MP3, 192 kbps
    </p>

    <input
      id="audioFile"
      type="file"
      accept=".mp3,.wav,.ogg,.flac,.m4a,.aac,.webm"
    >

    <button id="convertButton" disabled>
      Mulai Konversi
    </button>

    <p id="status" role="status" aria-live="polite">
      Pilih audio maksimal 5 MB.
    </p>

    <a id="downloadLink" download="zdc-output.mp3">
      Unduh Hasil MP3
    </a>

    <p class="warning">
      Tes ini hanya memproses audio di browser.
      Belum mengunggah audio ke Roblox.
    </p>
  </main>

  <script type="module">
    import { convertAudio } from "./audio-processor.js";

    const fileInput = document.getElementById("audioFile");
    const convertButton = document.getElementById("convertButton");
    const status = document.getElementById("status");
    const downloadLink = document.getElementById("downloadLink");

    let currentFile = null;
    let downloadUrl = null;

    function showError(error) {
      console.error("ZDC Audio Engine:", error);

      const detail =
        error?.stack ||
        error?.message ||
        String(error) ||
        "Penyebab error tidak diketahui.";

      status.textContent =
        "KONVERSI GAGAL:\n" + detail;

      status.style.color = "#ff8080";
      status.style.whiteSpace = "pre-wrap";
    }

    fileInput.addEventListener("change", () => {
      currentFile = fileInput.files?.[0] || null;

      if (downloadUrl) {
        URL.revokeObjectURL(downloadUrl);
        downloadUrl = null;
      }

      downloadLink.removeAttribute("href");
      downloadLink.style.display = "none";
      status.style.color = "#c5bacf";

      if (!currentFile) {
        convertButton.disabled = true;
        status.textContent = "Pilih audio terlebih dahulu.";
        return;
      }

      if (currentFile.size > 5 * 1024 * 1024) {
        convertButton.disabled = true;
        status.textContent =
          "Berkas terlalu besar. Maksimal 5 MB.";
        return;
      }

      const allowedExtensions =
        /\.(mp3|wav|ogg|flac|m4a|aac|webm)$/i;

      if (!allowedExtensions.test(currentFile.name)) {
        convertButton.disabled = true;
        status.textContent =
          "Format tidak didukung. Pilih MP3, WAV, OGG, FLAC, M4A, AAC, atau WEBM.";
        return;
      }

      convertButton.disabled = false;

      status.textContent =
        `Audio dipilih: ${currentFile.name}\n` +
        `Ukuran: ${(currentFile.size / 1024 / 1024).toFixed(2)} MB\n` +
        "Tekan Mulai Konversi untuk melanjutkan.";
    });

    convertButton.addEventListener("click", async () => {
      if (!currentFile) return;

      convertButton.disabled = true;
      fileInput.disabled = true;
      downloadLink.style.display = "none";
      status.style.color = "#c5bacf";

      try {
        status.textContent =
          "Memulai mesin konversi...\n" +
          "Pertama kali mungkin membutuhkan waktu untuk memuat FFmpeg.";

        const result = await convertAudio(currentFile, {
          onProgress(percent) {
            status.textContent =
              `Mesin konversi berjalan: ${percent}%\n` +
              "Jangan tutup halaman selama proses berlangsung.";
          }
        });

        if (!result?.blob || result.blob.size === 0) {
          throw new Error("Berkas hasil konversi kosong.");
        }

        if (downloadUrl) {
          URL.revokeObjectURL(downloadUrl);
        }

        downloadUrl = URL.createObjectURL(result.blob);

        downloadLink.href = downloadUrl;
        downloadLink.download = result.filename || "zdc-output.mp3";
        downloadLink.style.display = "block";

        status.style.color = "#80ffb0";
        status.textContent =
          "KONVERSI BERHASIL!\n" +
          `Nama: ${result.filename}\n` +
          `Ukuran hasil: ${(result.size / 1024 / 1024).toFixed(2)} MB\n` +
          "Tekan tombol Unduh Hasil MP3.";
      } catch (error) {
        showError(error);
      } finally {
        convertButton.disabled = false;
        fileInput.disabled = false;
      }
    });

    window.addEventListener("error", (event) => {
      console.error("Kesalahan browser:", event.error || event.message);
    });

    window.addEventListener("unhandledrejection", (event) => {
      console.error("Kesalahan proses:", event.reason);
    });

    window.addEventListener("beforeunload", () => {
      if (downloadUrl) {
        URL.revokeObjectURL(downloadUrl);
      }
    });
  </script>
</body>
</html>
